
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Restaurante Ghibli</title>
    <link rel="stylesheet" href="../cliente.css">
</head>
<body>

    <header class="cabecalho-cliente">
        <a class="marca" href="../inicio/inicio.html">Restaurante Ghibli</a>

        <div class="acoes-cabecalho">
            <a class="icone-link" href="../inicio/inicio.html">Início</a>
        </div>
    </header>

    <main class="pagina-conta">

        <section class="painel-lateral"></section>

        <section class="formulario-conta">
            <h2>Cadastrar</h2>

            <form id="formCadastro">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        maxlength="100"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="Somente números"
                        inputmode="numeric"
                        maxlength="14"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="DDD + número"
                        inputmode="tel"
                        maxlength="15"
                        autocomplete="tel"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        maxlength="100"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input
                        type="password"
                        id="confirmarSenha"
                        name="confirmarSenha"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button class="botao-principal" id="btCadastrar" type="submit">
                    Cadastrar
                </button>

            </form>

            <div id="aviso" class="aviso-form" aria-live="polite"></div>

            <div class="links-form">
                Já tem uma conta? <a href="../login/login.html">Entrar</a>
            </div>

        </section>

    </main>

    <script src="cadastro.js"></script>
</body>
</html>
